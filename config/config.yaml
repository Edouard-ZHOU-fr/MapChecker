# Configuration of check_lanelet_map.py
# Relative paths are relative to the directory of check_lanelet_map.py (MapChecker/); command line arguments override
# the settings here

# Lanelet2 map to check
input: lanelet2_map.osm

# List of manually ignored lanelets (if the file does not exist, no lanelet is ignored)
ignore_file: config/ignore.yaml

# Issue codes of Checks 1~3: code, severity (error / warning / off) and description of every issue type
# (each extension has its own in ext/<name>/config/issue_codes.yaml)
issue_codes_file: config/issue_codes.yaml

# Warning scoring model (generated by train_model.py), used when Using_LR is true
model_file: config/model.yaml

# Log output
log:
  enabled: true      # true: write to a log file (without colors) in addition to the terminal output
  dir: logs          # log directory: each run writes all its output files (log, heatmap, masque, files of the
                     #   extension checks) in a new directory map_check_YYYYmmdd_HHMMSS/ of it, named like it,
                     #   e.g. logs/map_check_YYYYmmdd_HHMMSS/map_check_YYYYmmdd_HHMMSS.log

# Issue heatmap (requires matplotlib)
heatmap:
  enabled: true      # true: list the areas with the most issues (Hotspots) at the end of the report,
                     #   and generate a map_check_YYYYmmdd_HHMMSS.png with the same name next to the log:
                     #   color the map by issue density from blue (few) to red (many), and circle these areas (#rank issue count);
                     #   when Using_LR is true, weighted by p: a scored WARNING counts as p issues, the others as 1,
                     #   i.e. the expected number of true issues
  radius: 30.0       # area radius (m): issues at most radius apart count as the same area, the heatmap spread is about radius
  top: 10            # maximum number of areas to label (an area needs at least 2 issues)

# Slow-down masque generated from the Hotspots above (requires heatmap.enabled)
masque:
  enabled: false     # true: also write map_check_YYYYmmdd_HHMMSS_masque.osm next to the log, a separate OSM file in
                     #   the same format as the masque_lanelet2.osm of the map repositories: one area per hotspot
                     #   (4 nodes + a way with type=detection_area, area=yes), the smallest rectangle containing the
                     #   issues of the hotspot enlarged by margin; lat/lon, local_x/y and ele of the nodes come from the map
  subtype: mapchecker_hotspot   # subtype of the areas (reason of the slow-down)
  slow_down_speed: 15           # slow_down_speed tag of the areas (km/h)
  height: 0.2                   # height tag of the areas
  margin: 3.0                   # distance (m) added around the issues of a hotspot on each side

# Issues as GeoJSON, for programs (comparing map versions, CI, statistics) and GIS tools (JOSM / QGIS open it as a layer)
json:
  enabled: true      # true: also write map_check_YYYYmmdd_HHMMSS.geojson next to the log: one point (lon/lat) per
                     #   issue with its code, severity, message, related ids, local x/y, p, and a key (code + ids)
                     #   identifying the issue across map versions

# Check thresholds
turn_angle: 30.0         # minimum heading change to count as a curve (degrees)
turn_window: 30.0        # maximum arc length window for computing the heading change (m)
min_overlap_area: 1.0    # minimum area to count as an overlap (m²)
parallel_min_length: 30.0  # parallel lanes are not an overlap: two lanelets that are both straight (heading change
parallel_min_gap: 1.8      #   < turn_angle) or go in opposite directions (heading difference > 150°), overlapping over at
                           #   least parallel_min_length (m), whose centerlines stay at least parallel_min_gap (m) apart
                           #   alongside the overlap, e.g. the two directions of a narrow or narrowing road overlapping
                           #   along the road, also on a bend (an intersection over such a length is practically
                           #   impossible); the centerlines of crossing / converging lanes come together (lanes covered by
                           #   a right_of_way: at most 1.0 m apart); a large parallel_min_gap (e.g. 99) disables it
ignore_isolated_turns: true   # true: if a curve does not cross / merge with other lanes (diverge does not count),
                              #   turn_direction is not checked
straight_as_turn_light: true  # true: straight counts as a turn signal, only check that curves and straight lanelets intersecting
                              #   other lanes have turn_direction set (left/right/straight all OK), the direction is not checked
                              # false: check that the direction matches the geometry (warn if a curve is tagged straight or the
                              #   direction is opposite; straight lanelets are not required to be tagged straight)
only_check_AOI: false          # true: only check lanelets fully inside the map AOI (type=detection_area, subtype=AOI);
                               #   if the map has no AOI, no check is performed

autoware_checking: false       # true: also run utils/validate_autoware_map.py (ROS must be sourced first) and merge the results:
                              #   its turn_direction results are merged into Check 1 (the same lanelet is reported only once),
                              #   the rest are reported in Check 3

Using_LR: true                # true: use the logistic regression model (model_file) to score WARNINGs about missing
                              #   turn_direction / right_of_way, output [WARNING p=0.93], where p is the probability that the
                              #   warning is a true issue (will later be fixed by the map team); each check outputs by descending p;
                              #   train_model.py must be run first to generate the model, see README.md
map_min_p: 0.5               # with Using_LR: scored WARNINGs whose p is below this are not shown in the heatmap (points,
                              #   coloring, hotspots and the pop-up window); the report and the log still list them;
                              #   0 shows all

isShow: true                  # true: after the report, show the heatmap in a window (pan, zoom, list of the hotspots and
                              #   issues, click an issue point or a lanelet for details; resizing the window never
                              #   stretches the map), the program exits when the window is closed;
                              #   requires heatmap.enabled to be true and a graphical interface (otherwise only a notice is printed)
