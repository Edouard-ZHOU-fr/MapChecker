# Configuration of train_model.py: generate training data from the git history of map repositories (utils/build_dataset.py)
# Relative paths are relative to MapChecker/; check thresholds use the settings in config.yaml
#
# For each repository, run Check 1 and Check 2 in chronological order on every committed revision of the map
# (and on the uncommitted changes), and track each warning:
#   label 1 (true issue):     the warning disappears in a later revision, because the turn_direction / a right_of_way
#                             covering the lanelet pair was added
#   label 0 (false positive): the warning remains until the latest revision, and
#                               - a related lanelet is in the ignore_file of that repository, or
#                               - after the warning appeared, at least min_fix_rounds revisions of the same repository fixed
#                                 other warnings of the same check, but this one was never fixed
#                                 (counted in revisions rather than fixed warnings, since one commit often fixes dozens at once)
#   unlabeled:                the warning disappears because the lanelet was deleted / its geometry changed, or it remains
#                             until the latest revision without meeting the conditions above (maybe just not fixed yet)
# Note: label means "whether the map team fixed it later", not whether Autoware really needs it

output_dir: data          # generates turn_direction.csv and right_of_way.csv
map: lanelet2_map.osm     # path of the map in the repository
include_working_copy: true  # if the map has uncommitted changes, use the working copy as the latest revision
autoware_checking: false     # true: also run the Autoware check (ROS must be sourced first), turn_direction warnings
                            #   detected only by Autoware (e.g. diverge) are also used as training samples; if false, the model
                            #   has never seen such warnings and they are not scored during checking
min_fix_rounds: 2

repos:
  - path: ~/milla_git_ws/Maps/Noisy_le_Roi_map_planning
    ignore_file: config/ignore.yaml
  - path: ~/milla_git_ws/Maps/buc_map_planning
  - path: ~/milla_git_ws/Maps/cern_map_planning
  - path: ~/milla_git_ws/Maps/demo_buc_map_planning
  - path: ~/milla_git_ws/Maps/larochelle_map_planning
  - path: ~/milla_git_ws/Maps/le_plessis_trevise_map_planning
  - path: ~/milla_git_ws/Maps/le_plessis_trevise_q2_map_planning
  # - path: ~/milla_git_ws/Maps/sqy_map_planning
  - path: ~/milla_git_ws/Maps/utac_map_planning
  - path: ~/milla_git_ws/Maps/antibes_map_planning
  - path: ~/milla_git_ws/Maps/louvois_map_planning
