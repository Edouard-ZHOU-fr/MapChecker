# 手动忽略的 lanelet
# 被忽略的 lanelet 不再输出对应的 WARNING / ERROR，并在报告末尾列出
#
# 写法:
#   - 614                       只写 lanelet id
#   - 614: 主路弯道，不需要转向灯   lanelet id: 忽略原因
#
# all:            所有检查都忽略
# turn_direction: 只在检查 1 (转向灯) 中忽略
# right_of_way:   只在检查 2 (路权) 中忽略，涉及该 lanelet 的重叠对和 right_of_way 规则元素都不再报告
# autoware:       只在检查 3 (Autoware) 中忽略，即该 lanelet 引用的红绿灯问题
#                 (Autoware 的 turn_direction 结果合并在检查 1 中，按 turn_direction 忽略)

